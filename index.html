<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>음악 감상 수행평가</title>
<style>
  :root{--bg:#1f0029;--panel:#2d1536;--ink:#1c0523;--sub:#7d6e86;--accent:#22002b;--line:#ebe4ee;--out:cubic-bezier(.22,1,.36,1)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0 auto;max-width:520px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;min-height:100vh;padding:12px 10px 60px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-weight:700}
  button,input{font-family:inherit}
  button:focus{outline:none}
  h1{margin:0;font-size:16px;line-height:1;font-weight:900;letter-spacing:-.02em}
  .card{background:#fff;border-radius:999px;height:38px;padding:0 16px;display:flex;align-items:center}
  .head .sub{font-size:12px;color:var(--sub);margin-top:4px}

  /* 탭 + 구독 버튼 한 줄 */
  .head{position:sticky;top:0;z-index:20;margin:-12px -10px 12px;padding:8px 18px;border-radius:0 0 26px 26px;background:rgba(31,0,41,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .tabRow{display:flex;align-items:center;gap:6px;margin:8px 0 0}
  .volRow{flex:1;min-width:0;display:flex;align-items:center;padding:0 8px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:38px;margin:0;background:transparent;cursor:pointer;touch-action:pan-y}
  input[type=range]:focus{outline:none}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,#f1e8f5 var(--p),rgba(255,255,255,.2) var(--p))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-4px;border-radius:50%;background:#f1e8f5;border:0;transition:transform .3s var(--out)}
  input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
  input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:rgba(255,255,255,.2)}
  input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:#f1e8f5}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#f1e8f5}
  .navFrame{flex:0 0 auto;padding:4px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18)}
  .nav{position:relative;display:flex;gap:6px;flex:0 0 auto}
  .nav .pill{position:absolute;top:0;bottom:0;left:0;width:0;border-radius:999px;background:#fff;transition:left .5s var(--out),width .5s var(--out)}
  .nav button{position:relative;z-index:1;height:38px;padding:0 20px;border:0;border-radius:999px;background:transparent;color:#f1e8f5;font-size:15px;font-weight:800;cursor:pointer;transition:color .4s var(--out),background-color .4s var(--out),transform .25s var(--out)}
  .nav button.on{background:transparent;color:var(--ink)}
  .nav button:active{transform:scale(.96)}
  .ytBtn{flex:1;min-width:0;height:38px;display:flex;align-items:center;justify-content:flex-end;padding:0 16px;border-radius:999px;text-decoration:none;color:var(--ink);font-size:15px;font-weight:900;white-space:nowrap;position:relative;overflow:hidden;background-image:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,226,242,.9) 55%,#ffc4e4 100%),var(--pet,none);background-size:auto,cover;background-position:0 0,center 38%;background-repeat:no-repeat;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .25s var(--out)}
  .ytBtn:active{transform:scale(.97)}
  .ytBtn span{position:relative;z-index:1}
  .ytBtn svg{position:relative;z-index:1;flex-shrink:0;margin-left:8px}
  .ytBtn::before{content:"";position:absolute;top:0;bottom:0;left:0;right:0;z-index:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.7) 50%,transparent 65%);transform:translate3d(-100%,0,0);backface-visibility:hidden;will-change:transform;animation:shine 6s cubic-bezier(.4,0,.2,1) infinite;pointer-events:none}
  @keyframes shine{0%{transform:translate3d(-100%,0,0)}35%,100%{transform:translate3d(100%,0,0)}}

  /* 화면 전환: 블러가 풀리며 ease-out으로 */
  .screen{display:none}
  .screen.active{display:block;animation:fadeIn .35s ease-out both}
  @keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  @keyframes riseSoft{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes qIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:none;}}
  @keyframes spinRot{to{transform:rotate(360deg)}}

  /* 시대별 카드 */
  .section{margin:0 0 12px}
  .section.eraCard{background:var(--panel);border-radius:34px;padding:12px 10px;animation:riseSoft .7s var(--out) both}
  #list .eraCard:nth-child(2){animation-delay:.08s}
  #list .eraCard:nth-child(3){animation-delay:.16s}
  .section h2{margin:2px 14px 10px;font-size:14px;font-weight:800;color:#d8c8e2}

  /* 곡 카드 */
  .track{background:#fff;border-radius:26px;margin-bottom:8px;overflow:hidden;transition:box-shadow .5s var(--out)}
  .track:last-child{margin-bottom:0}
  .track.open{box-shadow:0 10px 24px rgba(0,0,0,.25)}
  .tHead{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;transition:background-color .3s var(--out)}
  .tHead:active{background:#f7f2f9}
  .num{position:relative;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .3s var(--out)}
  .num svg{width:12px;height:12px;display:none}
  .num .iconPlay{display:block;margin-left:1px}
  .track.isPlaying .num .iconPlay{display:none}
  .track.isPlaying .num .iconPause{display:block}
  .track.open .num:active{transform:scale(.9)}
  .num .n{display:none}
  .meta{flex:1;min-width:0;font-size:15px;font-weight:700;color:var(--ink);line-height:1.35}
  .eq{display:none}
  .spin{display:block;opacity:0;transition:opacity .25s ease-out;width:14px;height:14px;border-radius:50%;border:2px solid #e6dcec;border-top-color:var(--accent);box-sizing:border-box;flex-shrink:0}
  .track.loading .spin{opacity:1;animation:spinRot .8s linear infinite}
  .tBody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--out)}
  .track.open .tBody{grid-template-rows:1fr}
  .tInner{min-height:0;overflow:hidden}
  .pad{padding:0 12px 14px;opacity:0;transform:translateY(-6px);transition:opacity .35s var(--out),transform .5s var(--out)}
  .track.open .pad{opacity:1;transform:none;transition-delay:.06s}
  .bar{position:relative;height:20px;margin:0 0 -8px;cursor:pointer;touch-action:pan-y}
  .bar::before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:var(--line);transition:transform .3s var(--out)}
  .fill{position:absolute;left:0;top:50%;height:6px;margin-top:-3px;width:0;background:var(--accent);border-radius:3px;transition:width .3s linear,transform .3s var(--out)}
  .bar.drag .fill{transition:none}
  .pTimes{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:8px;font-variant-numeric:tabular-nums;font-weight:700}
  .missWrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--out)}
  .missWrap.show{grid-template-rows:1fr;margin-top:8px}
  .missing{min-height:0;overflow:hidden;font-size:12px;color:#c0392b}

  /* 시험 카드 (시대 카드와 같은 톤) */
  .qcard{background:var(--panel);border-radius:36px;padding:12px;margin-bottom:12px;overflow:hidden}
  .qcard{scroll-margin-top:var(--headOff,100px);scroll-margin-bottom:16px}
  #quizList{padding-bottom:70vh}
  /* 전체 초기화: 평소에는 화면 하단에 떠 있고, 맨 아래로 내리면 마지막 카드 바로 아래에 위치 */
  .quizFoot{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;justify-content:center;padding:8px 0}
  .quizFoot .btn.ghost{background:rgba(24,8,34,.92);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);margin:0}
  .qcard.anim{animation:qIn .5s var(--out) both}
  .qcard.enter{animation:qIn .8s var(--out) both}
  .qcard.done{padding:12px}
  .qTitle{font-size:14px;font-weight:800;color:#d8c8e2;margin:2px 14px 10px}
  .playRow{display:flex;gap:8px;margin-bottom:10px}
  .playRow .btn.play{width:auto;height:40px;margin:0;padding:0 16px;border-radius:999px;background:#fff;color:var(--ink);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;flex:0 0 auto;transition:background-color .3s var(--out),transform .25s var(--out)}
  .playRow .btn.play.isPlaying{background:var(--accent);color:#fff}
  .playRow .btn.play.isPlaying .qCurTxt{color:#fff}
  .btn.play .pl{display:flex}
  .btn.play .pl svg{width:16px;height:16px;display:block}
  .btn.play .eq2{display:none}
  .qCurTxt{font-variant-numeric:tabular-nums;font-size:14px;font-weight:800;color:var(--ink)}
  .playRow .resetBtn{display:none;margin:0;width:auto;height:40px;padding:0 16px;border-radius:999px;background:#3a2046;color:#fff;border:0;font-size:14px;font-weight:800;cursor:pointer}
  .playRow .resetBtn.show{display:block;animation:fadeIn .5s var(--out) both}
  .qProg{margin-bottom:12px}
  .qBar{height:10px;border-radius:5px;background:rgba(255,255,255,.18);overflow:hidden}
  .qFill{height:100%;width:0;background:#fff;border-radius:5px;transition:width .3s linear}
  .quizFoot{padding:0}
  .quizFoot .btn{margin-top:0;animation:riseSoft .7s var(--out) .15s backwards}

  .row{background:#fff;border-radius:26px;margin-bottom:8px;overflow:hidden;transition:background-color .4s var(--out)}
  .row.ok{background:#e9f8ee}
  .row.ng{background:#fdecea}
  .rowHead{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;padding:13px 14px;font-size:15px;font-weight:800;color:var(--ink);cursor:pointer;text-align:left;transition:background-color .25s var(--out)}
  .rowHead:active:not(:disabled){background:#f6f0f9}
  .rowHead:disabled{cursor:default}
  .rl{font-size:13px;color:var(--sub);font-weight:700;flex-shrink:0}
  .rv{font-weight:800;text-align:right;color:var(--ink)}
  .rv.empty{color:#b9abc0;font-weight:700}
  .rowWrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--out)}
  .row.open .rowWrap{grid-template-rows:1fr}
  .rowInner{min-height:0;overflow:hidden}
  .rowOpts{display:grid;gap:6px;padding:0 10px 10px;max-height:300px;overflow-y:auto;opacity:0;transform:translateY(-6px);transition:opacity .35s var(--out),transform .5s var(--out)}
  .row.open .rowOpts{opacity:1;transform:none;transition-delay:.05s}
  .opt{border:0;background:#f4eef7;border-radius:999px;padding:10px 12px;text-align:left;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;transition:background-color .25s var(--out),transform .25s var(--out)}
  .row.open .opt{animation:optIn .4s var(--out) backwards;animation-delay:calc(var(--i,0) * 30ms)}
  @keyframes optIn{from{transform:translateY(-6px);}to{transform:none;}}
  .opt:active{transform:scale(.98);background:#ebdff1}
  .row[data-k="composer"] .rowOpts{grid-template-columns:1fr 1fr}
  .row[data-k="era"] .rowOpts{grid-template-columns:repeat(3,1fr)}

  .btn{display:block;width:100%;margin-top:12px;border:0;border-radius:999px;padding:13px 16px;font-size:15px;font-weight:800;cursor:pointer;background:#fff;color:var(--ink);transition:transform .25s var(--out),background-color .3s var(--out),color .3s var(--out)}
  .btn:active:not(:disabled){transform:scale(.98)}
  .btn:disabled{background:rgba(255,255,255,.14);color:rgba(255,255,255,.45);cursor:default}
  .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.28)}
  .btnRow{display:flex;gap:8px;margin-top:8px}
  .btnRow .btn{margin-top:0}
  .btnRow .btn.ghost{flex:1}
  .btnRow #mainBtn{flex:1;width:auto}

  .sRow{display:flex;gap:10px;align-items:flex-start}
  .rePlay{flex-shrink:0;width:auto;height:40px;padding:0 16px;border-radius:999px;border:0;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .25s var(--out),background-color .3s var(--out),color .3s var(--out)}
  .rePlay:active{transform:scale(.98)}
  .rePlay svg{width:16px;height:16px}
  .rePlay .ic-pause{display:none}
  .rePlay.isPlaying{background:var(--accent);color:#fff}
  .rePlay.isPlaying .ic-play{display:none}
  .rePlay.isPlaying .ic-pause{display:block}
  .sList{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
  .sPill{display:flex;align-items:center;gap:8px;min-height:40px;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:800;background:#fff;color:var(--ink)}
  .sLab{width:40px;flex-shrink:0;font-size:12px;color:var(--sub)}
  .sVals{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;white-space:normal}
  .sWrong{min-width:0;overflow-wrap:anywhere;color:#c0392b;background-image:linear-gradient(currentColor,currentColor);background-repeat:no-repeat;background-position:0 58%;background-size:0 1px;animation:strikeDraw .5s ease-out forwards,toBad .5s ease-out both}
  .sVal{min-width:0;overflow-wrap:anywhere}
  .sPill.ok .sVal{animation:toOk .5s ease-out both}
  .sPill.ng .sVal{animation:fadeIn .5s ease-out both}
  @keyframes strikeDraw{to{background-size:100% 1px}}
  .sPill{position:relative;will-change:transform}
  .sVals > span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;max-width:100%;line-height:1.3}
  .sPill .pt{position:absolute;left:50%;top:50%;border-radius:50%;pointer-events:none;z-index:2}
  @keyframes toBad{from{color:var(--ink)}to{color:#c0392b}}
  @keyframes toOk{from{color:var(--ink)}to{color:#2f9e44}}
  .qRows{display:block}

  .score{text-align:center;padding:16px 0;color:#fff}
  .score .big{font-size:40px;font-weight:900}
  .wrongList{text-align:left;font-size:14px;margin-top:12px;color:#fff}
  .wrongList li{margin-bottom:6px}

  .pet{display:flex;justify-content:center;margin:20px 0 8px}
  .petImg{width:min(100%,260px);height:auto;border-radius:20px;border:0;display:block;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;will-change:transform}

  .pet{display:none}
  /* ================= PC 레이아웃 (넓은 화면) ================= */
  @media (min-width:900px){
    body{max-width:780px;padding:28px 24px 100px}
    .head{top:0;padding:10px 24px;border-radius:0 0 32px 32px;margin:-28px -24px 18px}
    .tabRow{margin-top:10px;gap:10px}
    .ytBtn{height:46px;font-size:17px}
    .ytBtn svg{width:24px;height:24px}
    .nav button{height:46px;padding:0 28px;font-size:16px}
    .navFrame{padding:5px}
    input[type=range]{height:46px}
    input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px}
    input[type=range]::-webkit-slider-thumb{width:18px;height:18px;margin-top:-5px}
    input[type=range]::-moz-range-thumb{width:18px;height:18px}

    .section.eraCard{padding:16px 14px;border-radius:40px;margin-bottom:18px}
    .section h2{font-size:16px;margin:4px 18px 14px}
    .track{border-radius:32px;margin-bottom:10px}
    .tHead{padding:16px 20px;gap:14px}
    .num{width:34px;height:34px}
    .num svg{width:15px;height:15px}
    .meta{font-size:17px}
    .pad{padding:0 20px 18px}

    .qcard{padding:16px;border-radius:42px;margin-bottom:18px}
    .qTitle{font-size:16px;margin:4px 18px 14px}
    .row{border-radius:30px;margin-bottom:10px}
    .rowHead{padding:16px 20px;font-size:16px}
    .rl{font-size:14px}
    .opt{padding:12px 18px;font-size:16px}
    .rowOpts{padding:0 14px 14px}
    .row[data-k="composer"] .rowOpts{grid-template-columns:repeat(3,1fr)}
    .btn{padding:16px 20px;font-size:16px}
    .playRow .btn.play,.rePlay{height:46px}
    .sPill{min-height:46px;padding:8px 18px;font-size:16px}
    .sLab{width:52px;font-size:13px}
  }

  /* ================= PC 전용 애니메이션 (마우스 사용 환경) ================= */
  @media (hover:hover) and (pointer:fine){
    /* 배경에 천천히 떠다니는 빛 */
    body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
      background:radial-gradient(40% 40% at 20% 25%,rgba(255,196,228,.16),transparent 70%),
                 radial-gradient(45% 45% at 80% 70%,rgba(150,110,255,.16),transparent 70%);
      }

    /* 곡 카드: 마우스를 올리면 살짝 떠오르고 번호 버튼이 커짐 */
    .track{cursor:pointer;transition:box-shadow .5s var(--out),transform .45s var(--out)}
    .track:hover{box-shadow:0 12px 26px rgba(0,0,0,.3)}
    .track.open:hover{transform:none}
    .tHead:hover .num{transform:scale(1.12)}
    .tHead .meta{transition:transform .45s var(--out)}
    .tHead:hover .meta{transform:translateX(4px)}
        .bar:hover::before,.bar:hover .fill{transform:scaleY(1.7)}
    .bar:hover .fill{box-shadow:0 0 10px rgba(34,0,43,.45)}

    /* 탭 / 구독 버튼 */
    .nav button:not(.on):hover{color:#fff;background:rgba(255,255,255,.12)}
    .nav button{cursor:pointer}
    /* 호버 전환은 모두 ease-out으로 */
    .ytBtn{isolation:isolate;transition:transform .4s var(--out),box-shadow .5s var(--out)}
    .ytBtn:hover{box-shadow:0 10px 22px rgba(255,120,190,.4)}
    .btn,.playRow .btn.play,.rePlay{transition:transform .35s var(--out),box-shadow .45s var(--out),background-color .3s var(--out),color .3s var(--out)}
    .opt{transition:background-color .3s var(--out),transform .35s var(--out)}
    .rowHead{transition:background-color .3s var(--out)}
    .track{transition:transform .45s var(--out),box-shadow .5s var(--out)}
    .nav button{transition:color .4s var(--out),background-color .4s var(--out),transform .25s var(--out)}
    .ytBtn svg{transition:transform .5s var(--out)}
    .ytBtn:hover svg{transform:scale(1.2) rotate(-8deg)}

    /* 시험 항목 / 보기 / 버튼 */
    .rowHead:hover:not(:disabled){background:#f6f0f9}
    .opt:hover{background:#e9dcf0}
    
    .btn:hover:not(:disabled){transform:scale(1.02);box-shadow:0 8px 18px rgba(0,0,0,.28)}
    .btn.ghost:hover{background:rgba(255,255,255,.1)}
    .playRow .btn.play:hover,.rePlay:hover{transform:scale(1.03);box-shadow:0 8px 16px rgba(0,0,0,.25)}
    .playRow .resetBtn:hover{background:#4a2a58}

    /* 음량 슬라이더 */
    input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.25);box-shadow:0 0 0 6px rgba(241,232,245,.18)}


    /* 키보드 포커스 표시 */
    button:focus-visible,a:focus-visible{outline:2px solid #ffc4e4;outline-offset:2px}
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }

  /* 시험 카드: 제출 전/후 레이아웃 통일 — 카드 안쪽 여백 전부 동일 */
  .qcard{padding:12px}
  .sRow{display:grid;grid-template-columns:52px minmax(0,1fr);grid-template-rows:auto auto;row-gap:8px;column-gap:10px;align-items:start}
  .sRow .qNo{grid-column:1;grid-row:1;justify-self:center;align-self:stretch;display:flex;align-items:center;min-height:32px;font-size:13px;font-weight:800;color:#d8c8e2;white-space:nowrap}
  .sRow .resetBtn{grid-column:2;grid-row:1;justify-self:end;align-self:center;display:none;margin:0;height:32px;padding:0 12px;border:0;border-radius:999px;background:#3a2046;color:#fff;font-size:13px;font-weight:800;cursor:pointer}
  .sRow .resetBtn.show{display:block;animation:fadeIn .5s var(--out) both}
  .sRow .rePlay{grid-column:1;grid-row:2;justify-self:center;width:40px;height:40px;padding:0;margin:0;border-radius:50%;flex-shrink:0;color:var(--ink)}
  .sRow .sList{grid-column:2;grid-row:2}
  .sRow .qTop{grid-column:2;grid-row:1;justify-self:start;width:68%;display:flex;align-items:center;gap:8px;min-width:0;min-height:32px}
  .sRow .qProg{flex:1;min-width:0;margin:0}
  .sRow .rePlay .pl{display:flex}
  .sRow .rePlay .pl svg{width:16px;height:16px;display:block}
  .sRow .rePlay.isPlaying{color:#fff}
  .sRow .rePlay.isPlaying .qCurTxt{color:#fff}
  .sRow .qCurTxt{font-size:14px}
  .row{border-radius:20px;margin-bottom:0}
  .row .rowHead{min-height:40px;padding:6px 14px;gap:8px;justify-content:flex-start;font-size:14px}
  .row .rl{width:40px;flex-shrink:0;font-size:12px;color:var(--sub)}
  .row .rv{flex:1;min-width:0;text-align:left}
  .row .rv.empty{color:#b9abc0}
  .qProg{margin:0 0 8px}
  @media (min-width:900px){
    .row{border-radius:23px}
    .qcard{padding:16px}
    .sRow{grid-template-columns:60px minmax(0,1fr)}
    .sRow .qBar{height:12px;border-radius:6px}
    .sRow .qFill{border-radius:6px}
    .sRow .qNo{font-size:14px}
    .sRow .resetBtn{height:32px;font-size:13px}
    .sRow .qNo{min-height:32px}
    .sRow .rePlay{width:46px;height:46px}
    .sRow .qCurTxt{font-size:16px}
    .row .rowHead{min-height:46px;padding:8px 18px;font-size:16px}
    .row .rl{width:52px;font-size:13px}
  }

  /* 상단 한 줄: 문제 N · 재생 · 진행 바 · 초기화 (같은 높이, 세로 가운데) / 아래 답 칸은 전체 너비 */
  .sRow{display:flex;flex-direction:column;align-items:stretch;gap:8px}
  .sRow .qTop{display:flex;align-items:center;gap:8px;min-height:40px;min-width:0;width:auto;grid-column:auto;grid-row:auto;justify-self:auto}
  .sRow .qNo{display:flex;align-items:center;flex-shrink:0;white-space:nowrap;min-height:0;align-self:auto;justify-self:auto;grid-column:auto;grid-row:auto}
  .sRow .playSlot{display:none}
  .sRow .rePlay{grid-column:auto;grid-row:auto;justify-self:auto;align-self:auto;flex-shrink:0;margin:0}
  .sRow .qProg{flex:1;min-width:0;margin:0}
  .sRow .qTop{padding:0 14px}
  .sRow .resetBtn{grid-column:auto;grid-row:auto;justify-self:auto;align-self:auto;flex-shrink:0}
  .sRow .sList{grid-column:auto;grid-row:auto;width:100%}
  .sRow .qBar{height:12px;border-radius:6px}
  .sRow .qFill{border-radius:6px}
  .sRow .rePlay{width:56px;height:24px;border-radius:12px}
  .sRow .qNo{display:none}
  .sRow .rePlay .pl svg{width:16px;height:16px}

  /* ===== 새 디자인 ===== */
  .sRow{gap:0}
  .sRow .qTop{padding:0;min-height:0;gap:0;justify-content:flex-start}
  .sRow .qTop .resetBtn{margin-left:auto}
  .sRow .rePlay{width:auto;height:38px;padding:0 18px;gap:8px;border-radius:19px;background:#fff;color:#1c0523;font-size:16px;font-weight:800}
  .sRow .rePlay .pl svg{width:16px;height:16px}
  .sRow .qTime{font-size:16px;font-weight:800;color:#1c0523;font-variant-numeric:tabular-nums}
  .sRow .qProg{display:none}
  .sRow .sList{margin-top:14px}
  .sRow .qBar{height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
  .sRow .qFill{border-radius:3px;background:#fff}
  .sRow .sList{gap:7px}
  .row{border-radius:21px;margin:0}
  .row .rowHead{height:42px;padding:0 20px;font-size:15px}
  .row .rl{width:auto;white-space:nowrap;font-size:14px;color:#7c6a8a}
  .row .rv{flex:1;min-width:0;text-align:right;font-size:15px}
  .sLab{width:auto;min-width:52px;white-space:nowrap;flex-shrink:0}
  .btnRow{margin-top:12px}
  #mainBtn{height:42px}

  /* ===== 결과 애니메이션: 칸마다 순서대로 (날아옴 → 줄 긋기 → 색 변화 → 정답 등장), 모두 ease-out ===== */
  .sPill .sWrong{animation:strikeDraw .6s ease-out calc(var(--i) * 45ms + 160ms) forwards,toBad .6s ease-out calc(var(--i) * 45ms + 160ms) both}
  .sPill .sWrong + .sVal{animation:valIn .5s ease-out calc(var(--i) * 45ms + 420ms) both}
  .sPill.ok .sVal{animation:toOk .6s ease-out calc(var(--i) * 45ms + 160ms) both}
  .sPill.ng .sVal:not(.sWrong + .sVal){animation:none}
  @keyframes valIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}

  /* ===== 버튼 변화 애니메이션 / 요약 제목 크기 고정 ===== */
  .sRow .rePlay{min-width:112px;transition:background-color .3s ease-out,color .3s ease-out,transform .25s ease-out}
  .rePlay.isPlaying{transform:scale(1.04)}
  @keyframes enableIn{from{transform:scale(.96);opacity:.7}to{transform:scale(1);opacity:1}}
  #mainBtn:not(:disabled){animation:enableIn .35s ease-out}
  .sLab{font-size:14px;font-weight:700;color:#7c6a8a}

  /* ===== 수정 ===== */
  body{min-height:100dvh}
  .volIc{flex:0 0 auto;margin-right:6px;color:#f1e8f5;opacity:.75}
  /* 제출 결과 애니메이션은 방금 제출한 카드(.fresh)에서만 재생 (탭 전환/새로고침 때 다시 재생되지 않게) */
  .sWrong{color:#c0392b;background-size:100% 1px}
  .sPill.ok .sVal{color:#2b8a3e}
  @keyframes strikeDraw{from{background-size:0 1px}to{background-size:100% 1px}}
  @keyframes toOk{from{color:var(--ink)}to{color:#2b8a3e}}
  .qcard:not(.fresh) .sPill .sWrong,.qcard:not(.fresh) .sPill .sVal{animation:none}
  .rv.empty,.row .rv.empty{color:#80718a}
  /* 키보드 포커스는 모든 환경에서 표시 */
  button:focus-visible,a:focus-visible{outline:2px solid #ffc4e4;outline-offset:2px}
  input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 5px rgba(255,196,228,.5)}
</style>
</head>

<script>
/* 음원: HTML과 같은 위치의 audio 폴더 (1.mp3 ~ 13.mp3) */

function srcFor(n) {
  return `audio/${n}.mp3`;
}
const TRACKS = [
  { n:1,  composer:"베를리오즈", title:"환상 교향곡 중 제2악장 '무도회'", era:"낭만" },
  { n:2,  composer:"쇼팽",       title:"환상 즉흥곡",                     era:"낭만" },
  { n:3,  composer:"브람스",     title:"헝가리 무곡 5번",                 era:"낭만" },
  { n:4,  composer:"스메타나",   title:"나의 조국 중 제2곡 '몰다우'",      era:"국민악파" },
  { n:5,  composer:"그리그",     title:"페르 귄트 모음곡 중 '아침의 기분'", era:"국민악파" },
  { n:6,  composer:"그리그",     title:"페르 귄트 모음곡 중 '산 왕의 궁전에서'", era:"국민악파" },
  { n:7,  composer:"그리그",     title:"페르 귄트 모음곡 중 '솔베이그의 노래'", era:"국민악파" },
  { n:8,  composer:"드뷔시",     title:"목신의 오후 전주곡",              era:"근현대" },
  { n:9,  composer:"드뷔시",     title:"바다 중 제2악장 '파도의 희롱'",    era:"근현대" },
  { n:10, composer:"드뷔시",     title:"달빛",                           era:"근현대" },
  { n:11, composer:"쇤베르크",   title:"피아노 모음곡 제25번 전주곡",      era:"근현대" },
  { n:12, composer:"쇤베르크",   title:"달에 홀린 피에로 중 제1곡 '달에 취하여'", era:"근현대" },
  { n:13, composer:"스트라빈스키", title:"봄의 제전",                      era:"근현대" }
];
const COMPOSERS = [...new Set(TRACKS.map(t => t.composer))];
const ERAS = ["낭만", "국민악파", "근현대"];

const pad = n => String(n).padStart(2, "0");
const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);
const fmt = s => (isFinite(s) && s >= 0) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}` : "0:00";
const $ = (el, sel) => el.querySelector(sel);

/* ---------- 듣기: 카드 안에서 플레이어가 펼쳐짐 ---------- */
const list = document.getElementById("list");
const audio = document.getElementById("audio");
let cur = null; // 지금 펼쳐진 곡 카드

function renderList() {
  list.innerHTML = ERAS.map(era => `
    <div class="section eraCard">
      <h2>${era}</h2>
      ${TRACKS.filter(t => t.era === era).map(t => `
        <div class="track" data-n="${t.n}">
          <div class="tHead">
            <div class="num"><span class="n">${t.n}</span><svg class="iconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><svg class="iconPause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></div>
            <div class="meta">${t.composer} - ${t.title}</div>
            <div class="eq"><i></i><i></i><i></i></div><div class="spin"></div>
          </div>
          <div class="tBody"><div class="tInner"><div class="pad">
            <div class="pBar">
              <div class="bar"><div class="fill"></div></div>
              <div class="pTimes"><span class="pCur">0:00</span><span class="pDur">0:00</span></div>
            </div>
            <div class="missWrap"><div class="missing">음원을 재생할 수 없어요. 다른 브라우저(Chrome, Safari)로 열어 보세요.</div></div>
          </div></div></div>
        </div>`).join("")}
    </div>`).join("");
}

function setProgress(el, pct) {
  $(el, ".fill").style.width = Math.max(0, Math.min(100, pct)) + "%";
}

function resetCard(el) {
  setProgress(el, 0);
  $(el, ".pCur").textContent = "0:00";
  $(el, ".pDur").textContent = "0:00";
  $(el, ".missWrap").classList.remove("show");
}

function closeCard(el) {
  el.classList.remove("open", "isPlaying");
  setTimeout(() => { if (!el.classList.contains("open")) resetCard(el); }, 560);
}

function openCard(el) {
  if (cur && cur !== el) closeCard(cur);
  cur = el;
  el.classList.add("open");
  const n = +el.dataset.n;
  resetCard(el);
  document.querySelectorAll(".track.loading").forEach(t => t.classList.remove("loading"));
  el.classList.remove("isPlaying");
  el.classList.add("loading");
  audio.src = srcFor(n);
  audio.play().catch(() => {});
  // 펼쳐진 뒤에 카드가 화면에 다 보이도록 부드럽게 스크롤
  setTimeout(() => keepCardVisible(el), 540);
}

// 펼침/접힘 전환이 끝난 뒤, 상단바에 가리지 않게 카드 전체를 화면 안으로
function keepCardVisible(el) {
  if (!el.isConnected || !el.classList.contains("open")) return;
  const topLine = document.querySelector(".head").offsetHeight + 12;
  const r = el.getBoundingClientRect();
  let dy = 0;
  if (r.bottom > innerHeight - 16) dy = r.bottom - innerHeight + 16;
  if (r.top - dy < topLine) dy = r.top - topLine;
  if (dy) smoothScrollTo(scrollY + dy, 600);
}

list.addEventListener("click", e => {
  const head = e.target.closest(".tHead");
  if (head) {
    const el = head.parentElement;
    // 펼쳐진 카드에서 번호(재생/정지 버튼)를 누르면 재생 토글
    if (e.target.closest(".num") && el === cur && el.classList.contains("open")) {
      if (audio.paused) { rewindIfEnded(audio); audio.play().catch(() => {}); } else audio.pause();
      return;
    }
    if (el === cur && el.classList.contains("open")) {
      audio.pause();
      closeCard(el);
      cur = null;
    } else {
      openCard(el);
    }
    return;
  }
});

// 플레이 바 터치/드래그로 이동
let dragging = null;
function seekFromEvent(e) {
  const d = clipLen(audio);
  if (!dragging || !audio.duration || !cur) return;
  const r = dragging.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  audio.currentTime = pct * d;
  setProgress(cur, pct * 100);
  $(cur, ".pCur").textContent = fmt(audio.currentTime);
}
list.addEventListener("pointerdown", e => {
  const bar = e.target.closest(".bar");
  if (!bar || !cur || !cur.contains(bar)) return;
  dragging = bar;
  bar.classList.add("drag");
  bar.setPointerCapture(e.pointerId);
  seekFromEvent(e);
});
list.addEventListener("pointermove", e => { if (dragging) seekFromEvent(e); });
function endDrag() { if (dragging) { dragging.classList.remove("drag"); dragging = null; } }
list.addEventListener("pointerup", endDrag);
list.addEventListener("pointercancel", endDrag);

audio.addEventListener("loadstart", () => cur && cur.classList.add("loading"));
audio.addEventListener("waiting", () => cur && cur.classList.add("loading"));
audio.addEventListener("playing", () => { if (!cur) return; cur.classList.remove("loading"); cur.classList.add("isPlaying"); });
audio.addEventListener("pause", () => { if (!cur) return; cur.classList.remove("loading", "isPlaying"); });
audio.addEventListener("ended", () => { if (!cur) return; cur.classList.remove("loading", "isPlaying"); });
audio.addEventListener("error", () => { if (!cur) return; cur.classList.remove("loading", "isPlaying"); });
audio.addEventListener("loadedmetadata", () => { if (cur) $(cur, ".pDur").textContent = fmt(clipLen(audio)); });
audio.addEventListener("timeupdate", () => {
  if (!cur) return;
  const d = clipLen(audio);
  const pct = d ? (audio.currentTime / d) * 100 : 0;
  if (!dragging) setProgress(cur, pct);
  $(cur, ".pCur").textContent = fmt(audio.currentTime);
});
audio.addEventListener("error", () => {
  if (!cur || !audio.getAttribute("src")) return;
  const n = +cur.dataset.n;
  
  $(cur, ".missWrap").classList.add("show");
});

/* ---------- 시험 ---------- */
const quizList = document.getElementById("quizList");
const quizAudio = new Audio();
const replayAudio = new Audio();
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
let clipStarted = false; // 이 문제 음원을 한 번이라도 재생했는지
let replayBtnCur = null;
const FIELDS = [["composer", "작곡가"], ["title", "곡 이름"], ["era", "시대"]];

let deck = [], lastN = null, score = 0, wrongs = [], qNo = 0, asked = 0, scoreCard = null;
let curTrack, opts, correct, answers, activeCard, busy = false;

/* ---------- 시험 진행 상황 저장 (새로고침해도 유지) ---------- */
const SAVE_KEY = "music-quiz-state-v1";
let doneHTML = []; // 제출한 문제 카드들 (새로고침해도 내역 유지)
function saveQuiz() {
  try {
    sessionStorage.setItem(SAVE_KEY, JSON.stringify({
      done: doneHTML,
      deck: deck.map(t => t.n), lastN, score, wrongs, qNo, asked,
      curN: curTrack ? curTrack.n : null,
      answers: curTrack ? answers : null
    }));
  } catch (e) {}
}
function restoreQuiz() {
  let st = null;
  try { st = JSON.parse(sessionStorage.getItem(SAVE_KEY)); } catch (e) { return false; }
  if (!st || st.curN == null) return false;
  const t = TRACKS.find(x => x.n === st.curN);
  if (!t) return false;
  deck = st.deck.map(n => TRACKS.find(x => x.n === n)).filter(Boolean);
  lastN = st.lastN; score = st.score; wrongs = st.wrongs || []; qNo = st.qNo; asked = st.asked;
  curTrack = t;
  opts = makeOptions();
  correct = { composer: t.composer, title: t.title, era: t.era };
  answers = st.answers || { composer: null, title: null, era: null };
  busy = false;
  // 이전에 제출한 문제 내역 복원
  doneHTML = st.done || [];
  doneHTML.forEach(h => {
    const tmp = document.createElement("template");
    tmp.innerHTML = h.trim();
    quizList.insertBefore(tmp.content.firstElementChild, quizList.querySelector(".quizFoot"));
  });
  activeCard = document.createElement("div");
  activeCard.className = "qcard";
  activeCard.innerHTML = activeHTML();
  quizList.insertBefore(activeCard, quizList.querySelector(".quizFoot"));
  FIELDS.forEach(([k]) => {
    if (answers[k] === null) return;
    const rv = activeCard.querySelector(`.row[data-k="${k}"] .rv`);
    rv.textContent = answers[k];
    rv.classList.remove("empty");
  });
  updateMain();
  loadClip();
  return true;
}

let quizGen = 0, resetting = false;
function startQuiz(immediate) {
  if (resetting) return;
  const cards = [...quizList.querySelectorAll(".qcard")];
  if (immediate || !cards.length || window.scrollY < 40) return runStart(immediate);
  // 카드를 한꺼번에 지우면 화면이 튀므로: 페이드아웃 + 위로 스크롤한 뒤 새로 시작
  resetting = true;
  quizAudio.pause(); replayAudio.pause();
  quizList.style.pointerEvents = "none";
  cards.forEach(c => c.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 280, easing: "ease-out", fill: "forwards" }));
  smoothScrollTo(0, 600);
  setTimeout(() => { resetting = false; quizList.style.pointerEvents = ""; runStart(); }, 620);
}
function runStart(immediate) {
  quizGen++;
  replayAudio.pause();
  deck = []; lastN = null; score = 0; wrongs = []; qNo = 0; asked = 0; scoreCard = null; doneHTML = [];
  quizList.querySelectorAll(".qcard").forEach(c => c.remove());
  replayFoot();
  nextTrack(immediate);
}

// 13곡을 한 바퀴씩 섞어서 한 바퀴 안에서는 중복이 없게 출제
function nextFromDeck() {
  if (!deck.length) {
    deck = shuffle(TRACKS);
    if (lastN !== null && deck[0].n === lastN) {
      [deck[0], deck[deck.length - 1]] = [deck[deck.length - 1], deck[0]];
    }
  }
  lastN = deck[0].n;
  return deck.shift();
}

function makeOptions() {
  return {
    composer: COMPOSERS,
    title:    TRACKS.map(x => x.title),
    era:      ERAS
  };
}

function allAnswered() {
  return FIELDS.every(([k]) => answers[k] !== null);
}

function activeHTML() {
  return `
    <div class="sRow">
      <div class="qTop">
        <button class="rePlay" id="playBtn"><span class="pl"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span><span class="qTime" id="qCur">0:00</span></button>
        <button class="resetBtn" id="resetBtn">0초로 돌아가기</button>
      </div>
      <div class="qProg"><div class="qBar"><div class="qFill" id="qFill"></div></div></div>
      <div class="sList">${FIELDS.map(([k, label]) => `
        <div class="row" data-k="${k}">
          <button class="rowHead" data-k="${k}">
            <span class="rl">${label}</span>
            <span class="rv empty">선택하기</span>
          </button>
          <div class="rowWrap"><div class="rowInner"><div class="rowOpts">
            ${opts[k].map((o, i) => `<button class="opt" style="--i:${i}" data-v="${o}">${o}</button>`).join("")}
          </div></div></div>
        </div>`).join("")}</div>
    </div>
    <div class="btnRow">
      <button class="btn" id="mainBtn" disabled>확인</button>
    </div>`;
}

const EASE_OUT = "cubic-bezier(.22,1,.36,1)";
let scrollRaf = 0;
function smoothScrollTo(y, dur) {
  cancelAnimationFrame(scrollRaf);
  const max = document.documentElement.scrollHeight - window.innerHeight;
  y = Math.max(0, Math.min(y, max));
  const y0 = window.scrollY, dy = y - y0;
  if (Math.abs(dy) < 2) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { window.scrollTo(0, y); return; }
  dur = dur || Math.min(1600, Math.max(900, Math.abs(dy) * 1.5));
  const t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    window.scrollTo(0, y0 + dy * (1 - Math.pow(1 - p, 5))); // ease-out (행 펼침 곡선과 같은 계열)
    if (p < 1) scrollRaf = requestAnimationFrame(step);
  };
  scrollRaf = requestAnimationFrame(step);
}
// 사용자가 직접 스크롤하면 자동 스크롤은 즉시 양보
["wheel", "touchstart", "keydown"].forEach(ev =>
  window.addEventListener(ev, () => cancelAnimationFrame(scrollRaf), { passive: true }));

function nextTrack(immediate) {
  curTrack = nextFromDeck();
  qNo++;
  opts = makeOptions();
  correct = { composer: curTrack.composer, title: curTrack.title, era: curTrack.era };
  answers = { composer: null, title: null, era: null };
  busy = false;
  saveQuiz();
  dropPet();

  activeCard = document.createElement("div");
  activeCard.className = immediate ? "qcard anim" : "qcard";
  if (!immediate) activeCard.style.opacity = "0"; // 스크롤이 끝날 때까지 숨김
  activeCard.innerHTML = activeHTML();
  const foot = quizList.querySelector(".quizFoot");
  const footY0 = foot.getBoundingClientRect().top;
  quizList.insertBefore(activeCard, foot);
  if (!immediate) {
    // 카드가 끼어들며 아래로 밀리는 전체 초기화 버튼을 부드럽게 따라 내려가게
    const dy = foot.getBoundingClientRect().top - footY0;
    if (dy > 1) foot.animate(
      [{ transform: `translateY(${-dy}px)` }, { transform: "none" }],
      { duration: 700, easing: EASE_OUT }
    );
    revealCard(activeCard);
  }
  loadClip();
}

// 새 카드를 상단바 바로 아래에 맞춰 스크롤한 뒤, 스크롤이 끝나고 등장 애니메이션 재생
// (이전에는 등장 애니메이션 중에 스크롤해서 카드가 상단바와 겹치거나 중간에 사라져 보였음)
function revealCard(card) {
  const waits = quizEl.getAnimations ? quizEl.getAnimations().map(a => a.finished.catch(() => {})) : [];
  Promise.all(waits).then(() => {
    if (!card.isConnected) return;
    const head = document.querySelector(".head");
    const top = parseFloat(getComputedStyle(head).top) || 0;
    const line = top + head.offsetHeight + 12; // 상단바 아래 여백
    const y = card.getBoundingClientRect().top + window.scrollY - line;
    smoothScrollTo(y);
    // 스크롤이 시작된 직후 겹쳐서 등장 (카드 위치는 레이아웃 기준이라 어긋나지 않음)
    setTimeout(() => {
      if (!card.isConnected) return;
      card.style.opacity = "";
      card.classList.add("anim");
    }, 140);
  });
}

// 펼쳐진 항목의 보기들이 화면 안에 들어오도록, 누르자마자 스크롤
function keepRowVisible(row) {
  const head = row.querySelector(".rowHead");
  const opts = row.querySelector(".rowOpts");
  const bar = document.querySelector(".head");
  const top = parseFloat(getComputedStyle(bar).top) || 0;
  const topLine = top + bar.offsetHeight + 12;          // 상단바 아래 기준선
  const rect = row.getBoundingClientRect();
  const bottomAfter = rect.top + head.offsetHeight + opts.offsetHeight + 16; // 펼친 뒤 아랫변
  const foot = document.querySelector(".quizFoot");
  const reserve = (foot ? foot.offsetHeight : 0) + 40; // 하단 고정 '전체 초기화' 영역만큼 비워 둠
  const bottomLimit = window.innerHeight - reserve;
  let dy = 0;
  if (bottomAfter > bottomLimit) dy = bottomAfter - bottomLimit;
  else if (rect.top < topLine) dy = rect.top - topLine;
  if (dy) smoothScrollTo(window.scrollY + dy, 500);
}

// 고른 행의 위치에서 결과 칸 위치로 칸 전체를 이동 (글자는 크기를 바꾸지 않고 위치만 이동)
// 복제본(ghost)을 쓰지 않아서 이동 끝에 요소가 바뀌며 글자가 튀는 현상이 없음
function flyAnswers(card, from, h1, h2) {
  const EASE = EASE_OUT;
  const FLY = 620, STEP = 45;


  let count = 0;
  [...card.querySelectorAll(".sPill")].forEach((pill, i) => {
    const f = from[pill.dataset.k];
    if (!f) return;
    count++;
    const t = pill.getBoundingClientRect();           // 결과 칸의 현재 위치 (아직 애니메이션 전)
    const dx = (f.rect.left + f.rect.width / 2) - (t.left + t.width / 2);
    const dy = (f.rect.top + f.rect.height / 2) - (t.top + t.height / 2);
    // 선택한 글자: 우측 정렬 위치 -> 좌측 정렬 위치로 미끄러지듯 이동 (크기도 함께 보간)
    const sUser = pill.querySelector(".sUser");
    if (sUser && f.text) {
      const nl = sUser.getBoundingClientRect().left;     // 최종 위치 (pill 이동 전에 측정)
      const tx = f.text.left - nl - dx;                  // pill 자체 이동분(dx)은 제외
      const sc = f.fs / parseFloat(getComputedStyle(sUser).fontSize) || 1;
      sUser.style.transformOrigin = "left center";
      sUser.animate(
        [{ transform: `translateX(${tx}px) scale(${sc})` }, { transform: "none" }],
        { duration: FLY, delay: i * STEP, easing: EASE, fill: "backwards" }
      );
    }
    pill.animate(
      [{ transform: `translate(${dx}px, ${dy}px)`, opacity: 1 },
       { transform: "none", opacity: 1 }],
      { duration: FLY, delay: i * STEP, easing: EASE, fill: "backwards" }
    );
  });

  // 높이 변화: 결과 카드가 길어질 때 끊겨 보이지 않도록 한 번에 부드럽게 늘림 (레이아웃을 매 프레임 다시 계산하지 않게 고정 높이로 이동)
  if (h1 !== h2) {
    card.style.height = h1 + "px";
    card.style.transition = "none";
    void card.offsetHeight;
    card.style.transition = `height ${FLY + Math.max(0, count - 1) * STEP}ms ${EASE}`;
    card.style.height = h2 + "px";
    setTimeout(() => { card.style.transition = ""; card.style.height = ""; }, FLY + Math.max(0, count - 1) * STEP + 30);
  }
  return Math.max(0, count - 1) * STEP + FLY;
}

// 전체 초기화 버튼 등장 애니메이션을 다시 재생
function replayFoot() {
  const foot = quizList.querySelector(".quizFoot .btn");
  if (!foot) return;
  foot.style.animation = "none";
  void foot.offsetWidth;
  foot.style.animation = "";
}

function updateMain() {
  const b = activeCard && activeCard.querySelector("#mainBtn");
  if (b) b.disabled = !allAnswered();
}

function summaryHTML() {
  const rows = FIELDS.map(([k, label], i) => {
    const ok = answers[k] === correct[k];
    const vals = ok
      ? `<span class="sVal sUser">${correct[k]}</span>`
      : `<span class="sWrong sUser">${answers[k]}</span><span class="sVal">${correct[k]}</span>`;
    return `<div class="sPill ${ok ? "ok" : "ng"}" data-k="${k}" style="--i:${i}"><span class="sLab">${label}</span><span class="sVals">${vals}</span></div>`;
  }).join("");
  return `<div class="sRow">
    <div class="qTop">
      <div class="playSlot"></div>
    </div>
    <div class="sList">${rows}</div>
  </div>`;
}

// 카드 세로가 줄어들면서 요약 형태로 접힘
const PLAY_ICONS = '<svg class="ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
function collapse(card, html, after, from, keep) {
  const h1 = card.offsetHeight;
  const GROW = 700; // 결과 칸이 날아오는 시간과 맞춰야 카드 가장자리에 잘리지 않음
  card.classList.remove("anim");
  card.style.transition = "none";
  card.style.height = h1 + "px";
  // 텍스트는 바로 결과로 바꿈 (화면에 그려지기 전에 같은 순간 안에서 처리)
  const curTxt = card.querySelector("#qCur") ? card.querySelector("#qCur").textContent : "0:00";
  card.innerHTML = html;
  card.classList.add("done");
  const slot = card.querySelector(".playSlot");
  if (keep && slot) {
    keep.style.transition = "none";
    keep.removeAttribute("id");
    keep.className = "rePlay";
    keep.dataset.n = curTrack.n;
    keep.setAttribute("aria-label", "다시 듣기");
    keep.innerHTML = PLAY_ICONS + `<span class="qTime">${curTxt}</span>`;
    slot.replaceWith(keep);
  }
  // 결과 카드의 실제 최종 높이를 바로 잼 (높이 고정을 풀고 측정 후 다시 h1에서 시작)
  // 결과 카드의 실제 높이(버튼에 맞춘 높이)로 부드럽게 줄어듦
  card.style.height = "";
  const h2 = card.offsetHeight;
  card.style.height = h1 + "px";
  void card.offsetHeight;
  card.style.transition = `height ${GROW}ms ${EASE_OUT}`;
  card.style.height = h2 + "px";
  setTimeout(() => { card.style.transition = ""; card.style.height = ""; }, GROW + 30);
  if (keep) { void keep.offsetWidth; keep.style.transition = ""; }
  const snap = card.cloneNode(true);
  snap.removeAttribute("style");
  doneHTML.push(snap.outerHTML);
  saveQuiz();
  setTimeout(() => { card.style.pointerEvents = ""; }, 500);
  card.classList.add("fresh");
  setTimeout(() => card.classList.remove("fresh"), 1700);
  const flyMs = from ? flyAnswers(card, from, h2, h2) : 0;
  const gen = quizGen;
  setTimeout(() => { if (gen === quizGen) after(); }, flyMs + 900); // 초기화되었으면 다음 문제로 넘어가지 않음
}

function submit() {
  if (busy || !allAnswered()) return;
  busy = true;
  const card = activeCard;
  activeCard = null;
  FIELDS.forEach(([k, label]) => {
    if (answers[k] === correct[k]) score++;
    else wrongs.push(`${curTrack.composer} - ${curTrack.title} (${label}: 정답 ${correct[k]})`);
  });
  asked++;
  quizAudio.pause();
  // 입력했던 보기들의 현재 위치를 기억해 두고, 결과 자리로 옮겨 감
  const from = {};
  card.querySelectorAll(".row").forEach(r => {
    const node = r.cloneNode(true);
    node.classList.remove("open");
    const wrap = node.querySelector(".rowWrap");
    if (wrap) wrap.remove();
    const rv = r.querySelector(".rv");
    const rg = document.createRange(); rg.selectNodeContents(rv);
    from[r.dataset.k] = {
      rect: r.querySelector(".rowHead").getBoundingClientRect(), node,
      text: rg.getBoundingClientRect(),                 // 우측 정렬된 글자의 실제 위치
      fs: parseFloat(getComputedStyle(rv).fontSize)
    };
  });
  const playEl = card.querySelector("#playBtn");
  card.style.pointerEvents = "none";
  // 확인 버튼이 툭 사라지지 않도록 부드럽게 줄어들며 사라진 뒤 결과로 바뀜
  const mb = card.querySelector("#mainBtn");
  if (mb) mb.animate(
    [{ opacity: 1, transform: "none" }, { opacity: 0, transform: "scale(.96)" }],
    { duration: 220, easing: "ease-out", fill: "forwards" }
  );
  collapse(card, summaryHTML(), nextTrack, from, playEl); // 제출과 동시에 바로 시작
}

// 음원만 준비하고 재생은 사용자가 버튼을 눌렀을 때만
function loadClip() {
  quizAudio.pause();
  replayAudio.pause();
  quizAudio.src = srcFor(curTrack.n);
  quizAudio.currentTime = 0;
  clipStarted = false;
}

function setReplayIcon(btn, playing) {
  if (btn) btn.classList.toggle("isPlaying", playing);
}
function replayClip(btn, n) {
  if (replayBtnCur === btn && !replayAudio.paused) { replayAudio.pause(); return; }
  if (replayBtnCur && replayBtnCur !== btn) setReplayIcon(replayBtnCur, false);
  quizAudio.pause();
  replayBtnCur = btn;
  replayAudio.src = srcFor(n);
  replayAudio.currentTime = 0;
  replayAudio.play().catch(() => {});
  setReplayIcon(btn, true);
}
["pause", "ended"].forEach(ev => replayAudio.addEventListener(ev, () => setReplayIcon(replayBtnCur, false)));

function togglePlay() {
  replayAudio.pause();
  if (quizAudio.paused) {
    rewindIfEnded(quizAudio);
    quizAudio.play().catch(() => {});
  } else {
    quizAudio.pause();
  }
}

// 재생 버튼 상태를 실제 오디오 상태와 맞춤
function syncPlay() {
  const b = document.getElementById("playBtn");
  if (!b) return;
  const playing = !quizAudio.paused;
  b.classList.toggle("isPlaying", playing);
  const pl = b.querySelector(".pl");
  const want = playing ? "p" : "s";
  if (pl.dataset.st !== want) { pl.dataset.st = want; pl.innerHTML = playing ? ICON_PAUSE : ICON_PLAY; }

  // 멈춘 상태(재생 시작 후)에서만 초기화 버튼 표시
  const reset = document.getElementById("resetBtn");
  if (reset) {
    const show = clipStarted;
    if (show && !reset.classList.contains("show")) reset.classList.add("show");
    if (!show) reset.classList.remove("show");
  }
  updateQProg();
}

function updateQProg() {
  const fill = document.getElementById("qFill");
  if (!fill) return;
  const d = clipLen(quizAudio);
  const cur = document.getElementById("qCur");
  const dur = document.getElementById("qDur");
  fill.style.width = Math.min(100, (quizAudio.currentTime / d) * 100) + "%";
  if (cur) cur.textContent = fmt(quizAudio.currentTime);
  if (dur) dur.textContent = fmt(d);
}

function resetClip() {
  clipStarted = false;
  quizAudio.pause();
  quizAudio.currentTime = 0;
  syncPlay();
}
quizAudio.addEventListener("play", () => { clipStarted = true; });
["play", "pause", "ended", "loadstart", "timeupdate", "loadedmetadata"].forEach(ev => quizAudio.addEventListener(ev, syncPlay));

function showScore() {
  quizAudio.pause();
  replayAudio.pause();
  if (scoreCard) scoreCard.remove();
  const total = asked * 3;
  const el = document.createElement("div");
  el.className = "qcard enter";
  scoreCard = el;
  el.innerHTML = asked === 0
    ? `<div class="score">아직 푼 문제가 없어요</div>`
    : `<div class="score"><div>점수</div><div class="big">${score} / ${total}</div></div>
       ${wrongs.length
         ? `<div class="wrongList"><b>틀린 문항</b><ul>${wrongs.map(w => `<li>${w}</li>`).join("")}</ul></div>`
         : `<div class="score">모두 맞혔어요!</div>`}`;
  el.insertAdjacentHTML("beforeend", `<button class="btn" id="restart">다시 풀기</button>`);
  quizList.insertBefore(el, quizList.querySelector(".quizFoot"));
  el.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

quizList.addEventListener("click", e => {
  if (e.target.closest("#playBtn")) return togglePlay();
  if (e.target.closest("#resetBtn")) return resetClip();
  const rp = e.target.closest(".rePlay");
  if (rp) return replayClip(rp, +rp.dataset.n);
  if (e.target.closest("#restart")) return startQuiz();
  if (e.target.closest("#fullReset")) return startQuiz();
  if (!activeCard || !activeCard.contains(e.target)) return;

  if (e.target.closest("#mainBtn")) return submit();

  const head = e.target.closest(".rowHead");
  if (head) {
    const row = head.closest(".row");
    const willOpen = !row.classList.contains("open");
    row.classList.toggle("open", willOpen);
    // 펼친 뒤 카드 전체가 보이지 않으면 자동으로 스크롤
    // 누르는 순간 펼쳐질 최종 높이를 계산해서 바로 스크롤 (기다리지 않음)
    if (willOpen) keepRowVisible(row);
    return;
  }

  const opt = e.target.closest(".opt");
  if (opt) {
    const row = opt.closest(".row");
    const k = row.dataset.k;
    answers[k] = opt.dataset.v;
    saveQuiz();
    const rv = row.querySelector(".rv");
    rv.textContent = opt.dataset.v;
    rv.classList.remove("empty");
    rv.animate(
      [{ opacity: 0, transform: "translateY(4px)" },
       { opacity: 1, transform: "none" }],
      { duration: 380, easing: EASE_OUT }
    );
    row.classList.remove("open");
    updateMain();
  }
});

/* ---------- 탭 ---------- */
const tabListen = document.getElementById("tabListen");
const tabQuiz = document.getElementById("tabQuiz");
const listenEl = document.getElementById("listen");
const quizEl = document.getElementById("quiz");
const pill = document.getElementById("pill");
let quizStarted = false; // 시험을 한 번이라도 시작했는지 (듣기 갔다 와도 시험지 유지)

function movePill(instant) {
  const b = document.querySelector(".nav button.on");
  if (instant === true) pill.style.transition = "none"; // 첫 로드/리사이즈에서는 애니메이션 없이 제자리
  pill.style.left = b.offsetLeft + "px";
  pill.style.width = b.offsetWidth + "px";
  if (instant === true) { void pill.offsetWidth; pill.style.transition = ""; }
}

function show(which) {
  const toQuiz = which === "quiz";
  if (toQuiz === quizEl.classList.contains("active")) return;

  listenEl.classList.toggle("active", !toQuiz);
  quizEl.classList.toggle("active", toQuiz);

  tabListen.classList.toggle("on", !toQuiz);
  tabQuiz.classList.toggle("on", toQuiz);
  movePill();
  if (!toQuiz) window.scrollTo(0, 0);

  if (toQuiz) {
    audio.pause();
    replayFoot();
    if (!quizStarted) { quizStarted = true; startQuiz(true); }
    // 시험 탭으로 오면 자동 스크롤 없이 바로, 가장 아래(새) 시험지 카드가 상단바 아래에 오도록 이동
    const cards = quizList.querySelectorAll(".qcard");
    const last = cards[cards.length - 1];
    if (last) {
      // 등장 애니메이션(transform)의 영향을 받지 않도록 레이아웃 위치로 계산
      let y = 0;
      for (let el = last; el; el = el.offsetParent) y += el.offsetTop;
      const mt = parseFloat(getComputedStyle(last).scrollMarginTop) || 0;
      window.scrollTo(0, Math.max(0, y - mt));
    }
  }
  else { quizAudio.pause(); replayAudio.pause(); }
}
tabListen.onclick = () => show("listen");
tabQuiz.onclick = () => show("quiz");
window.addEventListener("resize", () => movePill(true));

document.querySelector(".ytBtn").style.setProperty("--pet", `url(${document.querySelector(".petImg").src})`);
renderList();
movePill(true);
if (restoreQuiz()) quizStarted = true;
/* ---------- 캐릭터: 위에서 블러가 풀리며 내려오기 ---------- */
function dropPet() {
  const el = document.querySelector(".pet");
  if (!el || !el.animate) return;
  el.animate([
    { transform: "translateY(-40px)", opacity: 0 },
    { transform: "translateY(0)", opacity: 1 }
  ], { duration: 800, easing: "cubic-bezier(.22,1,.36,1)" });
}

/* ---------- 캐릭터: 누르면 살짝 줄었다가 ease-out으로 복귀 ---------- */
(function () {
  const img = document.querySelector(".petImg");
  if (!img || !img.animate) return;
  const ease = "cubic-bezier(.22,1,.36,1)";
  let pressed = false;
  img.addEventListener("pointerdown", () => {
    pressed = true;
    img.getAnimations().forEach(a => a.cancel());
    img.animate([{ scale: "1" }, { scale: ".96" }], { duration: 350, easing: ease, fill: "forwards" });
  });
  const up = () => {
    if (!pressed) return;
    pressed = false;
    img.getAnimations().forEach(a => a.cancel());
    img.animate([{ scale: ".96" }, { scale: "1" }], { duration: 500, easing: ease });
  };
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => img.addEventListener(ev, up));
  img.addEventListener("contextmenu", e => e.preventDefault());
  img.addEventListener("dragstart", e => e.preventDefault());
})();

/* ---------- 음원은 25초까지만 재생 (표기·시험 포함) ---------- */
const CLIP = 25;
function clipLen(a) { return Math.min(a.duration || CLIP, CLIP); }
function enforceClip(a) { if (a.currentTime >= CLIP) { a.pause(); a.currentTime = CLIP; } }
function rewindIfEnded(a) { if (a.currentTime >= CLIP - 0.2) a.currentTime = 0; }
[audio, quizAudio, replayAudio].forEach(a => a.addEventListener("timeupdate", () => enforceClip(a)));


/* ---------- 음량 조절 (세 오디오 공통, 기본 50%) ---------- */
const volInput = document.getElementById("vol");
function paintVol() { volInput.style.setProperty("--p", (volInput.value * 100) + "%"); }
function applyVol() { audio.volume = quizAudio.volume = replayAudio.volume = +volInput.value; }
paintVol();
applyVol();
volInput.addEventListener("input", () => { paintVol(); applyVol(); });

/* ---------- 상단바 높이에 맞춰 아래 요소 위치 조정 ---------- */
function setBarVars() {
  const bar = document.querySelector(".topbar");
  if (bar) document.documentElement.style.setProperty("--bar-h", bar.offsetHeight + "px");
}
setBarVars();
function setHeadOff() {
  const h = document.querySelector(".head");
  if (!h) return;
  const top = parseFloat(getComputedStyle(h).top) || 0;
  document.documentElement.style.setProperty("--headOff", (h.offsetHeight + top + 12) + "px");
}
setHeadOff();
window.addEventListener("resize", () => { setBarVars(); setHeadOff(); });
document.fonts && document.fonts.ready.then(() => { setBarVars(); setHeadOff(); movePill(true); });
</script>
</body>
